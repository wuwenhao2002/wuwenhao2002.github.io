name: TCS Ontology Integrity & Quality

on:
  push:
    paths:
      - 'tcs-ontology/**'
      - '.github/workflows/tcs-ontology-validation.yml'
  pull_request:
    paths:
      - 'tcs-ontology/**'
      - '.github/workflows/tcs-ontology-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile and validate ontology
        run: |
          python3 -m py_compile tcs-ontology/tools/ontology.py tcs-ontology/tools/quality.py
          cd tcs-ontology
          python3 tools/ontology.py validate
          python3 tools/ontology.py quality
          python3 -m unittest discover -s tests -v
      - name: Validate reproducible SQL export
        run: |
          cd tcs-ontology
          python3 tools/ontology.py sqlite --output /tmp/tcs-ontology-ci.sqlite
          python3 - <<'PY'
          import sqlite3
          with sqlite3.connect('/tmp/tcs-ontology-ci.sqlite') as conn:
              assert not conn.execute('PRAGMA foreign_key_check').fetchall()
              assert conn.execute('SELECT COUNT(*) FROM primitive').fetchone()[0] >= 500
          PY
      - name: Check browser JavaScript syntax
        run: |
          node --check tcs-ontology/app.js
          node --check tcs-ontology/map.js
          node --check tcs-ontology/map-model.js
          node --test tcs-ontology/tests/test_graph.cjs

  harvest-bibliography:
    # Only this same-repository development branch may write the generated corpus.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feat/tcs-ontology-paper-graph'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - name: Checkout the source branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Harvest public DBLP metadata into an explicitly unreviewed corpus
        run: |
          if [ -f tcs-ontology/data/papers-harvested.json ]; then
            echo "Already harvested on this branch; skip repeated external fetch"
            exit 0
          fi
          cd tcs-ontology
          python3 tools/harvest_papers.py --limit 4000
      - name: Push generated corpus only
        run: |
          if [ ! -f tcs-ontology/data/papers-harvested.json ]; then
            echo "No generated corpus to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tcs-ontology/data/papers-harvested.json
          if ! git diff --cached --quiet; then
            git commit -m "data(papers): import title-inferred DBLP metadata with review flags"
            git push origin HEAD:${{ github.head_ref }}
          fi
