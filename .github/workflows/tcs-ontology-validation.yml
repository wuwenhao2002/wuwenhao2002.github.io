name: TCS Ontology Data Validation

on:
  push:
    paths:
      - 'tcs-ontology/**'
      - '.github/workflows/tcs-ontology-validation.yml'
  pull_request:
    paths:
      - 'tcs-ontology/**'
      - '.github/workflows/tcs-ontology-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile scripts and validate ontology
        run: |
          python3 -m py_compile tcs-ontology/tools/ontology.py
          cd tcs-ontology
          python3 tools/ontology.py validate
          python3 -m unittest discover -s tests -v
      - name: Check browser JavaScript syntax
        run: node --check tcs-ontology/app.js
